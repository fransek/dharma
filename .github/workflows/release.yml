name: 🚀 Release

on:
  push:
    branches:
      - main

env:
  CI: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Version and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to mint the OIDC token used for trusted publishing
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the version from `packageManager` in package.json. `changeset publish`
      # runs `pnpm publish`, and pnpm's OIDC (trusted publishing) support needs >=12
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Create release PR or build and publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm ci:publish
          title: "release: version packages"
          commit: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # docs/main is the Vercel production branch (dharma.fransek.dev), so it
      # should only move when a release is actually published. main itself is
      # served as the release candidate on next.dharma.fransek.dev.
      - name: Deploy docs for the published release
        if: steps.changesets.outputs.published == 'true'
        run: git push origin HEAD:refs/heads/docs/main
